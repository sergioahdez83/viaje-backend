server.port=8082
spring.datasource.url=jdbc:postgresql://localhost:5432/viaje_db
spring.datasource.username=admin
spring.datasource.password=password123
spring.jpa.hibernate.ddl-auto=update

# Muestra las consultas SQL en la consola
# No requiero mostrar en consola las consultas de hibernate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.show_sql=false
spring.jpa.properties.hibernate.format_sql=true

# Ampliar el limite maximo por archivo a 10MB
spring.servlet.multipart.max-file-size=10MB
# Ampliar el limite maximo de la peticion total a 10MB
spring.servlet.multipart.max-request-size=10MB